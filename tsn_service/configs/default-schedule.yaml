# The schedule is read from top to bottom, which means that the first defined traffic class will be active first
#
# Available traffic classes are:
# isochronous
# cyclic-sync
# cyclic-async
# alarms-events
# config-diag
# network-control
# best-effort
# Timecritical
# Mapping: managementInfo.ip_address -> port.id -> gating cycle and gate list.
# Each port below is independent, even when another switch uses the same port ID.
# Other management IPs use the shared per-port defaults above.
switches:
  # Relyum: preserve the tested allocation, with independently editable ports.
  - management-ip: "192.168.4.64"
    ports:
      # Port 1: Critical Real-Time / Isochronous Control (1 ms cycle)
      - port-id: P1
        gating-cycle: 1 # ms
        traffic-classes:
            - name: isochronous
              assigned-portion: 20 # in %
            - name: cyclic-sync
              assigned-portion: 10
            - name: cyclic-async
              assigned-portion: 10
            - name: network-control
              assigned-portion: 10
            - name: config-diag
              assigned-portion: 10
            - name: alarms-events
              assigned-portion: 10
            - name: best-effort
              assigned-portion: 20
            - name: Timecritical
              assigned-portion: 10

 

 # B&R: 8 traffic classes per port, exact multiples of 320 ns (1 ms cycle)
  - management-ip: "192.168.4.65"
    ports:
      - port-id: P2
        gating-cycle: 1 # ms
        traffic-classes:
          - name: Timecritical
            assigned-portion: 20       # 200,000 ns (625 * 320 ns)
          - name: network-control
            assigned-portion: 16       # 160,000 ns (500 * 320 ns)
          - name: isochronous
            assigned-portion: 16       # 160,000 ns (500 * 320 ns)
          - name: cyclic-sync
            assigned-portion: 12       # 120,000 ns (375 * 320 ns)
          - name: alarms-events
            assigned-portion: 12       # 120,000 ns (375 * 320 ns)
          - name: cyclic-async
            assigned-portion: 8        #  80,000 ns (250 * 320 ns)
          - name: config-diag
            assigned-portion: 8        #  80,000 ns (250 * 320 ns)
          - name: best-effort
            assigned-portion: 8        #  80,000 ns (250 * 320 ns)
