apiVersion: apps/v1
kind: Deployment
metadata:
  name: main-service
  namespace: opencnc
spec:
  replicas: 1
  selector:
    matchLabels:
      app: main-service
  template:
    metadata:
      labels:
        app: main-service
    spec:
      containers:
        - name: main-service
          image: opencnc/main-service:latest
          imagePullPolicy: IfNotPresent
          env:
            - name: CONFIG_SERVICE_HOST
              value: "config-service"
            - name: CONFIG_SERVICE_PORT
              value: "5150"
            - name: TSN_SERVICE_HOST
              value: "tsn-service"
            - name: TSN_SERVICE_PORT
              value: "5152"
            - name: ETCD_HOST
              value: "etcd"
            - name: ETCD_PORT
              value: "2379"
            - name: MAIN_SERVICE_NNI_PORT
              value: "8000"
            - name: MAIN_SERVICE_UNI_GRPC_PORT
              value: "5153"
            - name: MAIN_SERVICE_UNI_HTTP_PORT
              value: "8081"
            - name: OBS_BROKERS
              value: "kafka:9092"
            - name: OBS_ENABLED
              value: "true"
            - name: OBS_KAFKA_ENABLED
              value: "true"
            - name: OBS_FAIL_OPEN
              value: "true"
          ports:
            - name: uni-grpc
              containerPort: 5153
            - name: nni-http
              containerPort: 8000
            - name: uni-http
              containerPort: 8081
---
apiVersion: v1
kind: Service
metadata:
  name: main-service
  namespace: opencnc
spec:
  selector:
    app: main-service
  ports:
    - name: uni-grpc
      port: 5153
      targetPort: 5153
    - name: nni-http
      port: 8000
      targetPort: 8000
    - name: uni-http
      port: 8081
      targetPort: 8081