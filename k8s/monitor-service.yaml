apiVersion: apps/v1
kind: Deployment
metadata:
  name: monitor-service
  namespace: opencnc
spec:
  replicas: 1
  selector:
    matchLabels:
      app: monitor-service
  template:
    metadata:
      labels:
        app: monitor-service
    spec:
      containers:
        - name: monitor-service
          image: opencnc/monitor-service:latest
          imagePullPolicy: IfNotPresent
          env:
            - name: MONITOR_SERVICE_BIND_HOST
              value: "0.0.0.0"
            - name: MONITOR_SERVICE_PORT
              value: "5151"
            - name: CONFIG_SERVICE_HOST
              value: "config-service"
            - name: CONFIG_SERVICE_PORT
              value: "5150"
            - name: OBS_BROKERS
              value: "kafka:9092"
            - name: OBS_ENABLED
              value: "true"
            - name: OBS_KAFKA_ENABLED
              value: "true"
            - name: OBS_FAIL_OPEN
              value: "true"
          ports:
            - containerPort: 5151
---
apiVersion: v1
kind: Service
metadata:
  name: monitor-service
  namespace: opencnc
spec:
  selector:
    app: monitor-service
  ports:
    - name: grpc
      port: 5151
      targetPort: 5151