apiVersion: apps/v1
kind: Deployment
metadata:
  name: config-service
  namespace: opencnc
spec:
  replicas: 1
  selector:
    matchLabels:
      app: config-service
  template:
    metadata:
      labels:
        app: config-service
    spec:
      containers:
        - name: config-service
          image: opencnc/config-service:latest
          imagePullPolicy: IfNotPresent
          env:
            - name: CONFIG_SERVICE_BIND_HOST
              value: "0.0.0.0"
            - name: CONFIG_SERVICE_PORT
              value: "5150"
            - name: OBS_BROKERS
              value: "kafka:9092"
            - name: OBS_ENABLED
              value: "true"
            - name: OBS_KAFKA_ENABLED
              value: "true"
            - name: OBS_FAIL_OPEN
              value: "true"
          ports:
            - containerPort: 5150
---
apiVersion: v1
kind: Service
metadata:
  name: config-service
  namespace: opencnc
spec:
  selector:
    app: config-service
  ports:
    - name: grpc
      port: 5150
      targetPort: 5150