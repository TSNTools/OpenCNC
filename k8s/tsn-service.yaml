apiVersion: apps/v1
kind: Deployment
metadata:
  name: tsn-service
  namespace: opencnc
spec:
  replicas: 1
  selector:
    matchLabels:
      app: tsn-service
  template:
    metadata:
      labels:
        app: tsn-service
    spec:
      containers:
        - name: tsn-service
          image: opencnc/tsn-service:latest
          imagePullPolicy: IfNotPresent
          env:
            - name: TSN_SERVICE_PORT
              value: "5152"
            - name: ETCD_HOST
              value: "etcd"
            - name: ETCD_PORT
              value: "2379"
            - name: OBS_BROKERS
              value: "kafka:9092"
            - name: OBS_ENABLED
              value: "true"
            - name: OBS_KAFKA_ENABLED
              value: "true"
            - name: OBS_FAIL_OPEN
              value: "true"
          ports:
            - containerPort: 5152
---
apiVersion: v1
kind: Service
metadata:
  name: tsn-service
  namespace: opencnc
spec:
  selector:
    app: tsn-service
  ports:
    - name: grpc
      port: 5152
      targetPort: 5152