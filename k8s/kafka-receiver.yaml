apiVersion: apps/v1
kind: Deployment
metadata:
  name: kafka-receiver
  namespace: opencnc
  labels:
    app: kafka-receiver
spec:
  replicas: 1
  selector:
    matchLabels:
      app: kafka-receiver
  template:
    metadata:
      labels:
        app: kafka-receiver
      annotations:
        sidecar.istio.io/inject: "false"
    spec:
      containers:
        - name: kafka-receiver
          image: opencnc/kafka-receiver:latest
          imagePullPolicy: IfNotPresent
          args:
            - "-brokers=kafka.opencnc.svc.cluster.local:9092"
            - "-topics=opencnc.metrics,opencnc.events,opencnc.logs"
            - "-json-topic=opencnc.latencies.json"
            - "-monitoring-json-topic=opencnc.monitoring.json"
            - "-group=opencnc-receiver-v1"
            - "-output-dir=/data"
            - "-from-beginning=true"
          volumeMounts:
            - name: data-dir
              mountPath: /data
      volumes:
        - name: data-dir
          emptyDir: {}
